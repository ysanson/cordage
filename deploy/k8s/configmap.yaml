# Mirrors benchmarks/schema.json -- mounted into the coordinator only.
# Workers never read schema.json locally; the coordinator sends it
# per-shard over the wire in ShardRequest.Schema (see worker.proto).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cordage-schema
data:
  schema.json: |
    {
      "delimiter": ";",
      "hasHeader": false,
      "columns": [
        {"name": "station", "type": 0, "kind": 0},
        {"name": "temperature", "type": 2, "kind": 1}
      ]
    }
