# Replica count is the scale knob for the M5 horizontal-scaling demo:
#   kubectl scale deployment/cordage-worker --replicas=N
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cordage-worker
  labels:
    app: cordage-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cordage-worker
  template:
    metadata:
      labels:
        app: cordage-worker
    spec:
      containers:
      - name: cordage-worker
        image: cordage:local
        imagePullPolicy: IfNotPresent
        command: ["/cordage", "worker", "--listen", ":50051"]
        ports:
        - containerPort: 50051
        volumeMounts:
        - name: dataset
          mountPath: /data
          readOnly: true
      volumes:
      - name: dataset
        hostPath:
          path: /mnt/cordage-data
          type: Directory
